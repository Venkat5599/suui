services:
  vibe-trading:
    build: .
    ports:
      - "127.0.0.1:8899:8899"
    env_file:
      - agent/.env
    environment:
      - VIBE_TRADING_TRUST_DOCKER_LOOPBACK=1
    volumes:
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
      - vibe-runtime:/home/vibe/.vibe-trading
    restart: unless-stopped

  # Autonomous trading worker: runs the agent on a schedule, 24/7.
  # Shares the runtime volume with the API container so a `live halt`
  # tripped anywhere instantly stops the worker's next cycle.
  worker:
    build: .
    # All VIBE_AUTO_* config lives in agent/.env. Do NOT also list them under
    # `environment:` with ${VAR:-} defaults — an explicit environment entry
    # overrides env_file, so an unset host var would blank the prompt.
    env_file:
      - agent/.env
    volumes:
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
      - vibe-runtime:/home/vibe/.vibe-trading
    command: ["vibe-trading-worker"]
    # The worker doesn't serve HTTP, so override the image's API healthcheck.
    # Healthy = it has written a valid heartbeat (proves the loop is alive).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json; json.load(open('/home/vibe/.vibe-trading/autonomous/heartbeat.json'))\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    depends_on:
      vibe-trading:
        condition: service_started

  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "5899:5899"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://vibe-trading:8899
    command: sh -c "npm install && npm run dev -- --host --port 5899"
    profiles:
      - frontend
    depends_on:
      vibe-trading:
        condition: service_started

volumes:
  vibe-runs:
  vibe-sessions:
  vibe-runtime:
